[project]
name = "bacdetect"
version = "0.1.0"
description = "ML detection of Broken Access Control / IDOR vulnerabilities in Pull Requests"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Maksymilian Shestalyuk" }, { name = "Daniil Tymofieiev" }]
dependencies = [
    "scikit-learn>=1.8",
    "scipy>=1.11",
    "numpy>=1.26",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Stage A: CodeXGLUE download from Hugging Face
data = ["datasets>=2.19"]
# Scenario 2 (later): CodeBERT / GraphCodeBERT fine-tuning
transformers = ["torch>=2.2", "transformers>=4.40"]

[project.scripts]
bacdetect = "bacdetect.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bacdetect"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"src/bacdetect/train.py" = ["S301"]   # joblib/pickle of our own artifacts
"src/bacdetect/scan.py" = ["S310"]          # urllib to api.github.com
"src/bacdetect/extract.py" = ["S603", "S607"]  # git subprocess, refs validated

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
